version: "3"

services:
  web:
    build: .
    #image: nexryai/nexkey
    restart: always
    container_name: nexkey_web
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro
      - ./log:/var/log/misskey
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    restart: always
    image: redis:7.2.5-alpine3.20
    container_name: nexkey_redis
    volumes:
      - ./redis:/data
    healthcheck:
      test: "redis-cli ping"
      timeout: 2s
      interval: 2s
      start_period: 10s
      retries: 5

  db:
    restart: always
    image: postgres:16.4-alpine3.20
    container_name: nexkey_db
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"
      timeout: 2s
      interval: 2s
      start_period: 10s
      retries: 5

